name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Mit Maven bauen
        run: mvn -B clean package

      - name: JAR als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pvpheads-jar
          path: target/pvpheads.jar

      - name: JAR ins Repo zurückcommitten
        run: |
          mkdir -p build
          cp target/pvpheads.jar build/pvpheads.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/pvpheads.jar
          git diff --staged --quiet && echo "Keine Änderung" || git commit -m "Update built JAR [skip ci]"
          git push || echo "Nichts zu pushen"
